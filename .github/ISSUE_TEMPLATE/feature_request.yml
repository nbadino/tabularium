name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your archive, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: pages
    attributes:
      label: Example pages
      description: A public-domain page showing the case helps a lot.
