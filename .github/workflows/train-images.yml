name: train-images

on:
  workflow_dispatch:
  # main only: a feature branch must never overwrite the mutable tags cloud runs pull.
  push:
    branches: [main]
    paths:
      - "docker/train-qwen/**"
      - "docker/train-legacy/**"
      - "docker/train-glm/**"
      - "docker/train-paddle/**"
      - "docker/train-dots/**"
      - "docker/train-uocr2/**"
      - ".github/workflows/train-images.yml"

permissions:
  contents: read
  packages: write

# Never two builds pushing the same tag at once; queue, do not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: qwen
            tag: qwen-v1
          - profile: legacy
            tag: legacy-v1
          - profile: glm
            tag: glm-v1
          - profile: paddle
            tag: paddle-v1
          - profile: dots
            tag: dots-v1
          - profile: uocr2
            tag: uocr2-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/train-${{ matrix.profile }}
          push: true
          tags: ghcr.io/nbadino/tabularium-train-${{ matrix.profile }}:${{ matrix.tag }}
          provenance: false
