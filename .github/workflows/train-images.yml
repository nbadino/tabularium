name: train-images

on:
  workflow_dispatch:
  # main only: a feature branch must never overwrite the mutable tags cloud runs pull.
  push:
    branches: [main]
    paths:
      - "docker/train-qwen/**"
      - "docker/train-legacy/**"
      - "docker/train-glm/**"
      - "docker/train-paddle/**"
      - "docker/train-dots/**"
      - "docker/train-uocr2/**"
      - ".github/workflows/train-images.yml"

permissions:
  contents: read
  packages: write

# Never two builds pushing the same tag at once; queue, do not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: qwen
            tag: qwen-v1
          - profile: legacy
            tag: legacy-v1
          - profile: glm
            tag: glm-v1
          - profile: paddle
            tag: paddle-v1
          - profile: dots
            tag: dots-v1
          - profile: uocr2
            tag: uocr2-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/train-${{ matrix.profile }}
          push: true
          tags: ghcr.io/nbadino/tabularium-train-${{ matrix.profile }}:${{ matrix.tag }}
          provenance: false
