# CI minima: test backend, typecheck + test + build frontend, pulizia del
# working tree dopo la build (nessun artefatto versionato per sbaglio).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 resta fuori finché FastAPI/Starlette/TestClient non
        # saranno verificati insieme; la matrice coincide con il supporto
        # dichiarato dal progetto.
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installa dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Nessun artefatto versionato
        working-directory: .
        run: |
          # La build non deve modificare file tracciati; gli artefatti
          # (*.tsbuildinfo, dist/) devono restare ignorati.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::La build ha modificato o generato file non ignorati:"
            git status --porcelain
            exit 1
          fi

  # La dashboard e la preparazione dati sono dichiarate multipiattaforma. Una
  # build solo Linux non intercetta regressioni nei launcher POSIX, nelle wheel
  # Python o nel bundle frontend su macOS. Manteniamo una singola versione
  # Python qui: la matrice completa delle versioni resta nel job backend.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa e testa il backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q
      - name: Installa, testa e compila il frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Verifica launcher macOS
        run: |
          bash -n scripts/setup_backend.sh scripts/setup_frontend.sh \
            scripts/build_frontend.sh scripts/run.sh \
            scripts/run_backend.sh scripts/run_frontend.sh \
            scripts/test_backend.sh
      - name: Nessun artefatto versionato
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::La build macOS ha modificato o generato file non ignorati:"
            git status --porcelain
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      TABULARIUM_E2E_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Chrome e chromedriver dalla stessa azione, così le versioni sono per
      # costruzione allineate. Non basta installare solo Chrome: l'immagine
      # `ubuntu-latest` porta già un chromedriver sul PATH, e Selenium Manager
      # preferisce quello, che resta indietro rispetto al browser appena
      # installato. Il percorso del driver va quindi passato esplicito
      # (`TABULARIUM_CHROMEDRIVER`, che `e2e_workflow.py` già legge), altrimenti
      # si ricade sul PATH e si torna a
      # `SessionNotCreatedException: This version of ChromeDriver only supports
      # Chrome version 152`.
      - name: Chrome e chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - name: Installa dipendenze
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          cd frontend && npm ci && npm run build
      - name: Avvia il backend (auth disattivata)
        working-directory: backend
        run: |
          TABULARIUM_AUTH=off TABULARIUM_ROOT="$RUNNER_TEMP/tabularium-e2e" \
            nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8787 > "$RUNNER_TEMP/tabularium-server.log" 2>&1 &
          for _ in {1..60}; do
            curl -fsS "$TABULARIUM_E2E_URL/api/health" >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS "$TABULARIUM_E2E_URL/api/health"
      - name: Smoke E2E (SPA + deep-link)
        run: scripts/e2e_smoke.sh
        env:
          TABULARIUM_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - name: Workflow E2E (archivio → annotazione → dataset → training)
        run: python3 scripts/e2e_workflow.py
        env:
          TABULARIUM_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          TABULARIUM_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      - name: Log del server in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: ${{ runner.temp }}/tabularium-server.log
          if-no-files-found: ignore
