# CI: backend tests, frontend typecheck + tests + build, container health, E2E,
# and a clean working tree after the build (no build artefact tracked by mistake).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 stays out until FastAPI/Starlette/TestClient are verified
        # together; the matrix matches the support the project declares.
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          # `opencv-python` (from the OCR engine) loads libGL/libglib: without
          # them `import cv2` fails on a headless runner.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest tests -q
      # The generated manifest is the cheap proof that a model is complete across
      # the whole application, not only in the file a pull request touched.
      - name: Model surface invariants
        run: python ../scripts/surfaces.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: No tracked build artefacts
        working-directory: .
        run: |
          # The build must not modify tracked files; artefacts
          # (*.tsbuildinfo, dist/) must stay ignored.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build modified or created non-ignored files:"
            git status --porcelain
            exit 1
          fi

  # The dashboard and data preparation are declared cross-platform. A Linux-only
  # build misses regressions in the POSIX launchers, Python wheels or the frontend
  # bundle on macOS. One Python version here; the full matrix is the backend job.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q
      - name: Install, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Check the macOS launchers
        run: |
          bash -n scripts/setup_backend.sh scripts/setup_frontend.sh \
            scripts/build_frontend.sh scripts/run.sh \
            scripts/run_backend.sh scripts/run_frontend.sh \
            scripts/test_backend.sh
      - name: No tracked build artefacts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The macOS build modified or created non-ignored files:"
            git status --porcelain
            exit 1
          fi

  container:
    # The image is the deployment artifact for a server installation, and this job is
    # where it is actually verified: build it, start it, wait for /api/health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -f docker/app/Dockerfile -t tabularium:ci .
      - name: Start it and wait for health
        run: |
          docker run -d --name tabularium-ci -p 8788:8787 -e TABULARIUM_AUTH=off tabularium:ci
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null 2>&1; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs tabularium-ci
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs tabularium-ci || true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      TABULARIUM_E2E_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Chrome and chromedriver from the same action, so their versions match by
      # construction. Installing Chrome alone is not enough: `ubuntu-latest` already
      # has a chromedriver on PATH, Selenium Manager prefers it, and it lags behind
      # the freshly installed browser. The driver path is therefore passed explicitly
      # (`TABULARIUM_CHROMEDRIVER`, read by `e2e_workflow.py`), otherwise PATH wins
      # and we are back to
      # `SessionNotCreatedException: This version of ChromeDriver only supports
      # Chrome version 152`.
      - name: Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          cd frontend && npm ci && npm run build
      - name: Start the backend (auth off)
        working-directory: backend
        run: |
          TABULARIUM_AUTH=off TABULARIUM_ROOT="$RUNNER_TEMP/tabularium-e2e" \
            nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8787 > "$RUNNER_TEMP/tabularium-server.log" 2>&1 &
          for _ in {1..60}; do
            curl -fsS "$TABULARIUM_E2E_URL/api/health" >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS "$TABULARIUM_E2E_URL/api/health"
      - name: Smoke E2E (SPA + deep-link)
        run: scripts/e2e_smoke.sh
        env:
          TABULARIUM_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - name: Workflow E2E (archive → annotation → dataset → training)
        run: python3 scripts/e2e_workflow.py
        env:
          TABULARIUM_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          TABULARIUM_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      - name: Server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: ${{ runner.temp }}/tabularium-server.log
          if-no-files-found: ignore
