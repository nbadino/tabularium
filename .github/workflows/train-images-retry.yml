name: train-images-retry

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/train-qwen/**"
      - "docker/train-dots/**"
      - ".github/workflows/train-images-retry.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dots
            tag: dots-v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/train-${{ matrix.profile }}
          push: true
          tags: ghcr.io/nbadino/tabularium-train-${{ matrix.profile }}:${{ matrix.tag }}
          provenance: false
