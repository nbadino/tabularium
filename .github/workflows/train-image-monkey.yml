name: train-image-monkey

on:
  workflow_dispatch:
  # main only: a feature branch must never overwrite the mutable tags cloud runs pull.
  push:
    branches: [main]
    paths:
      - "docker/train-monkey/**"
      - ".github/workflows/train-image-monkey.yml"

permissions:
  contents: read
  packages: write

# Never two builds pushing the same tag at once; queue, do not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/train-monkey
          push: true
          tags: |
            ghcr.io/nbadino/tabularium-train-monkey:monkey-v4
            ghcr.io/nbadino/tabularium-train-monkey:monkey-${{ github.sha }}
          provenance: false
      # Package visibility is set once in the GHCR settings: GITHUB_TOKEN cannot change it.
