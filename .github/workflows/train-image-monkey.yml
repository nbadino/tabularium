name: train-image-monkey

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/train-monkey/**"
      - ".github/workflows/train-image-monkey.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/train-monkey
          push: true
          tags: |
            ghcr.io/nbadino/tabularium-train-monkey:monkey-v4
            ghcr.io/nbadino/tabularium-train-monkey:monkey-${{ github.sha }}
          provenance: false
      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/tabularium-train-monkey -f visibility=public
