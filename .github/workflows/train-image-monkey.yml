name: train-image-monkey

on:
  workflow_dispatch:
  # main only: a feature branch must never overwrite the mutable tags cloud runs pull.
  push:
    branches: [main]
    paths:
      - "docker/train-monkey/**"
      - ".github/workflows/train-image-monkey.yml"

permissions:
  contents: read
  packages: write

# Never two builds pushing the same tag at once; queue, do not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/train-monkey
          push: true
          tags: |
            ghcr.io/nbadino/tabularium-train-monkey:monkey-v4
            ghcr.io/nbadino/tabularium-train-monkey:monkey-${{ github.sha }}
          provenance: false
      # Package visibility is set once in the GHCR settings: GITHUB_TOKEN cannot change it.
