name: train-image-monkey

on:
  workflow_dispatch:
  # main only: a feature branch must never overwrite the mutable tags cloud runs pull.
  push:
    branches: [main]
    paths:
      - "docker/train-monkey/**"
      - ".github/workflows/train-image-monkey.yml"

permissions:
  contents: read
  packages: write

# Never two builds pushing the same tag at once; queue, do not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/train-monkey
          push: true
          tags: |
            ghcr.io/nbadino/tabularium-train-monkey:monkey-v4
            ghcr.io/nbadino/tabularium-train-monkey:monkey-${{ github.sha }}
          provenance: false
      # Package visibility is set once in the GHCR settings: GITHUB_TOKEN cannot change it.
