name: release

# Publishes a GitHub release with the frontend already built, so installing
# Tabularium needs Python only (no Node.js, no git): source archives for
# `scripts/run.sh` and a wheel for `uv tool install`. With the repository
# variable PYPI_PUBLISH=true the wheel also goes to PyPI (trusted publishing).
# Trigger: push a tag vX.Y.Z matching the VERSION file.
# Manual runs build the archives as workflow artifacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # R14: a tag on a red commit must not publish. Same checks as ci.yml, one Python.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and model surfaces
        working-directory: backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q
          python ../scripts/surfaces.py --check
      - name: Frontend typecheck and tests
        working-directory: frontend
        run: npm ci && npm run typecheck && npm test

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build wheel
        run: uv build --wheel -o out

      - name: Check the wheel installs and starts
        run: |
          uv tool install --python 3.12 out/*.whl
          tabularium --version
          tabularium --no-browser --port 8790 --data "$RUNNER_TEMP/tab-data" &
          SERVER=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8790/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8790/ | grep -q '<div id="root">'
          kill "$SERVER"

      - name: Assemble archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME="tabularium-${VERSION}"
          mkdir -p out stage
          git archive --format=tar --prefix="${NAME}/" HEAD | tar -x -C stage
          mkdir -p "stage/${NAME}/frontend"
          cp -R frontend/dist "stage/${NAME}/frontend/dist"
          # Tells run.sh / run.ps1 that this build is prebuilt: never rebuild it.
          echo "${VERSION}" > "stage/${NAME}/frontend/dist/.prebuilt"
          (cd stage && tar -czf "../out/${NAME}.tar.gz" "${NAME}" && zip -qr "../out/${NAME}.zip" "${NAME}")
          (cd out && sha256sum *.tar.gz *.zip *.whl > SHA256SUMS.txt)
          ls -l out

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no notes for ${VERSION}" >&2
            exit 1
          fi
          {
            echo
            echo "## Install"
            echo
            echo "With [uv](https://docs.astral.sh/uv/) (installs the right Python for you):"
            echo
            echo '```bash'
            echo "uv tool install https://github.com/nbadino/tabularium/releases/download/v${VERSION}/tabularium-${VERSION}-py3-none-any.whl"
            echo "tabularium"
            echo '```'
            echo
            echo "Or download \`tabularium-${VERSION}.zip\` (Windows) or \`.tar.gz\` (macOS/Linux), extract it, then:"
            echo
            echo '```bash'
            echo "cd tabularium-${VERSION}"
            echo "./scripts/setup_backend.sh   # Windows: scripts\\setup_backend.ps1"
            echo "./scripts/run.sh             # Windows: scripts\\run.ps1"
            echo '```'
            echo
            echo "Container: \`docker pull ghcr.io/nbadino/tabularium:${VERSION}\`."
            echo
            echo "Upgrading? Back up first: \`tabularium backup\`. See [Upgrading and rollback](https://nbadino.github.io/tabularium/guide/upgrading/)."
            echo
            echo "Only Python 3.11–3.13 is required. See the [installation guide](https://nbadino.github.io/tabularium/guide/installation/)."
          } >> notes.md
          cat notes.md

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tabularium-${{ steps.version.outputs.version }}
          path: out/*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Tabularium ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    needs: release
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tabularium/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the wheel from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p "*.whl" -D dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # The container image, so a container upgrade is a pull, not a rebuild from a checkout.
  # A new GHCR package is private: make it public once in the package settings.
  image:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and push ghcr.io/${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -f docker/app/Dockerfile -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          docker push --all-tags "${IMAGE}"
